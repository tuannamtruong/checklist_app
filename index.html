<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1f2937" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>Checklist</title>
    <script>
      // X-14. The theme has to be on the root before the first paint, or a dark
      // one flashes white while the bundle loads — past_decision.md §9. It reads
      // the key `src/app/theme.svelte.ts` writes and sets the attribute
      // `src/app.css` keys its palettes on; anything unreadable falls through to
      // the light default already in the stylesheet.
      //
      // X-25 rides the same line for the same reason: a sidebar that renders at
      // normal and then jumps to maximal is the flash this exists to prevent,
      // and it is one more read to prevent it. The two are otherwise strangers —
      // past_decision.md §15.3.
      try {
        var root = document.documentElement;
        var t = localStorage.getItem('checklist.theme');
        if (t) root.setAttribute('data-theme', t);
        var s = localStorage.getItem('checklist.sidebarsize');
        if (s) root.setAttribute('data-sidebar-size', s);
        // X-35 rides it too, and is the one of the three that has to check what
        // it read: an id this build does not know falls through to a default,
        // but a `--accent-pick` that is not a colour makes `--color-accent`
        // invalid and the app paints without an accent at all.
        ['accent', 'ink'].forEach(function (role) {
          var c = localStorage.getItem('checklist.colour.' + role);
          if (!/^#[0-9a-f]{6}$/i.test(c || '')) return;
          root.style.setProperty('--' + role + '-pick', c);
          root.setAttribute('data-' + role + '-pick', c);
        });
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
