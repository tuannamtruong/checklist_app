plugins {
    id "com.android.application"
}

android {
    namespace "dev.checklist.proto"
    compileSdk 34

    defaultConfig {
        applicationId "dev.checklist.proto"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1-prototype"
    }

    buildTypes {
        debug {
            // Signed with the debug keystore Gradle generates. Enough to
            // sideload; not enough for Play, which this is not going near.
            applicationIdSuffix ""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // WebViewAssetLoader: serves the bundled page over an https:// origin so ES
    // modules load. From a file:// origin the browser blocks them outright.
    implementation "androidx.webkit:webkit:1.11.0"
    // DocumentFile: the readable way to walk a SAF tree.
    implementation "androidx.documentfile:documentfile:1.0.1"
}

// The web app is not duplicated into the Android project — it is copied from
// prototype/ at build time, so there is exactly one copy of the sync core and
// the APK can never drift from what the desktop build runs.
def webSrc = rootProject.file("../")
def webOut = layout.buildDirectory.dir("webassets")

tasks.register("copyWebAssets", Copy) {
    from(webSrc) {
        include "public/**"
        include "core/**"
        include "adapters/**"
    }
    into webOut
}

android.sourceSets.main.assets.srcDir(webOut)
tasks.named("preBuild") { dependsOn("copyWebAssets") }
